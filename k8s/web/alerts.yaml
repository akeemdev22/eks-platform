apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: web-alerts
  labels:
    release: monitoring
spec:
  groups:
    - name: web.rules
      rules:
        - alert: WebPodsUnavailable
          expr: |
            sum(kube_pod_status_ready{namespace="web", pod=~"web-.*", condition="true"}) < 3
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "web has fewer ready pods than it should"
            description: "Fewer than 3 web pods have been ready for 2 minutes. See docs/runbook.md."

        - alert: WebDown
          expr: |
            (sum(kube_pod_status_ready{namespace="web", pod=~"web-.*", condition="true"}) or vector(0)) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "web has no ready pods"
            description: "The web app is completely down. Users cannot reach the site. See docs/runbook.md."

        - alert: WebPodRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="web"}[10m]) > 2
          labels:
            severity: warning
          annotations:
            summary: "web pod {{ $labels.pod }} keeps restarting"
            description: "{{ $labels.pod }} restarted more than 2 times in 10 minutes. Check its logs in Loki."

        - alert: WebRolloutStuck
          expr: |
            max by (pod) (kube_pod_container_status_waiting_reason{namespace="web", reason=~"ImagePullBackOff|ErrImagePull|CrashLoopBackOff|CreateContainerConfigError"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "web pod {{ $labels.pod }} cannot start"
            description: "{{ $labels.pod }} has been stuck for 5 minutes (bad image or crashing). Check kubectl describe pod, then git revert the last change."