name: Build and release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-and-release.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: eks-platform-web

jobs:
  release:
    name: Build, scan and release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        run: echo "IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$IMAGE" ./app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image to ECR
        run: docker push "$IMAGE"

      - name: Update image tag in Git
        run: |
          sed -i "s|^\(\s*image:\).*|\1 $IMAGE|" k8s/web/rollout.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/web/rollout.yaml
          git commit -m "Release web image ${GITHUB_SHA::7}"
          git pull --rebase
          git push